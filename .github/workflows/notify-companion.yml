# Wakes the maintainer agent when there is issue work. GitHub can only notify the agent through
# a pull request it watches, so this posts a short comment on the open "Companion inbox" draft
# pull request (branch claude/companion-inbox) whenever an issue is opened or reopened, or the
# repository owner comments on an issue. The agent then reads the issue itself.
# The agent posts from the owner's account too; its own comments carry the hidden marker
# <!-- maintainer-agent --> and are skipped, so it is not woken by itself.
name: notify companion
on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
permissions:
  issues: write
  pull-requests: write
jobs:
  ping:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request == null && github.event.comment.user.login == github.repository_owner &&
       !contains(github.event.comment.body, '<!-- maintainer-agent -->'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const open = await github.rest.pulls.list({ owner, repo, state: 'open', head: `${owner}:claude/companion-inbox` });
            if (open.data.length === 0) { core.notice('No open Companion inbox pull request; nothing to notify.'); return; }
            const inbox = open.data[0].number;
            let body;
            if (context.eventName === 'issues') {
              const i = context.payload.issue;
              body = `Issue #${i.number} ${context.payload.action} by @${i.user.login}.`;
            } else if (context.eventName === 'issue_comment') {
              const i = context.payload.issue;
              body = `New comment on issue #${i.number} by @${context.payload.comment.user.login}.`;
            } else {
              body = 'Test ping from the notify companion workflow.';
            }
            await github.rest.issues.createComment({ owner, repo, issue_number: inbox, body });
